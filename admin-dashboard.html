<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard – MediCare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230f766e%27/%3E%3Cpath d=%27M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z%27 fill=%27white%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Admin dashboard</h1>
          <p>Review doctor applications and manage doctors, users and appointments.</p>
        </div>
        <button class="btn btn-outline btn-sm" id="resetBtn" type="button">Reset demo data</button>
      </div>

      <div id="banner" aria-live="polite"></div>
      <section class="grid grid-4" id="stats" aria-label="Summary" style="margin-bottom:22px"></section>

      <div class="tabs" id="tabs" role="tablist" aria-label="Admin sections">
        <button class="tab" role="tab" aria-selected="false" data-t="applications" type="button">Applications<span class="chip-count hidden" id="appCount">0</span></button>
        <button class="tab" role="tab" aria-selected="false" data-t="doctors" type="button">Doctors</button>
        <button class="tab" role="tab" aria-selected="false" data-t="appointments" type="button">Appointments</button>
        <button class="tab" role="tab" aria-selected="false" data-t="users" type="button">Users</button>
      </div>

      <section class="card" id="panel" aria-live="polite"></section>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var me = App.init({ active: 'admin-dashboard.html' });
      if (!me) return;
      var U = MC.util, esc = App.esc;
      var $ = function (id) { return document.getElementById(id); };
      var tab = MC.Admin.pendingApplications().length ? 'applications' : 'doctors';
      var apptFilter = 'all';

      /* report the outcome of a permission-checked action */
      function done(r, okMsg) {
        if (!r || !r.ok) { App.toast((r && r.error) || 'Something went wrong.', 'error'); return false; }
        if (okMsg) App.toast(okMsg, 'ok');
        return true;
      }
      function dateOf(ts) { return ts ? new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'; }
      function badge(s) { return '<span class="badge ' + esc(s) + '">' + esc(s) + '</span>'; }

      function renderStats() {
        var appts = MC.Appts.all(), users = MC.Users.all();
        function stat(icon, cls, n, label) { return '<div class="card stat"><div class="stat-icon ' + cls + '" aria-hidden="true">' + icon + '</div><div><strong>' + n + '</strong><span>' + label + '</span></div></div>'; }
        var pending = MC.Admin.pendingApplications().length;
        $('stats').innerHTML =
          stat('🩺', '', MC.Doctors.active().length, 'Active doctors') +
          stat('👥', 'blue', users.filter(function (u) { return u.role === 'patient'; }).length, 'Patients') +
          stat('📅', 'green', appts.length, 'Appointments') +
          stat('📝', 'amber', pending, 'Pending applications');
        var chip = $('appCount'); chip.textContent = pending; chip.classList.toggle('hidden', !pending);
        $('banner').innerHTML = pending
          ? '<div class="alert warn" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span><strong>' + pending + ' doctor application' + (pending > 1 ? 's' : '') + '</strong> waiting for your review.</span>' + (tab !== 'applications' ? '<button class="btn btn-sm btn-outline" id="openApps" type="button">Review now</button>' : '') + '</div>'
          : '';
      }

      /* ---------- applications ---------- */
      function applicationsPanel() {
        var apps = MC.Admin.applications();
        if (!apps.length) return '<div class="card-head"><h2>Doctor applications</h2></div><div class="empty"><div class="big" aria-hidden="true">✅</div><p>No applications to review.</p></div>';
        var rows = apps.map(function (x) {
          var u = x.user, d = x.doctor || {};
          var actions = '<button class="btn btn-outline btn-sm" data-details="' + esc(u.id) + '" type="button">Details</button>' +
            '<button class="btn btn-ok btn-sm" data-approve="' + esc(u.id) + '" type="button">' + (u.status === 'rejected' ? 'Approve instead' : 'Approve') + '</button>' +
            (u.status === 'pending' ? '<button class="btn btn-ghost-danger btn-sm" data-reject="' + esc(u.id) + '" type="button">Reject</button>' : '');
          return '<article class="appt"><div class="appt-main"><span class="avatar md" aria-hidden="true">' + esc(MC.Doctors.initials(u.name)) + '</span>' +
            '<div style="min-width:0"><h3>' + esc(u.name) + ' ' + badge(u.status) + '</h3>' +
            '<p>' + esc(u.email) + '</p>' +
            '<p>' + esc(d.specialty || '—') + ' · License ' + esc(u.license || d.license || '—') + ' · ' + (d.experience != null ? d.experience + ' yrs' : '—') + ' · Applied ' + dateOf(u.appliedAt) + '</p></div></div>' +
            '<div class="appt-actions">' + actions + '</div></article>';
        }).join('');
        return '<div class="card-head"><h2>Doctor applications</h2></div><p class="muted small">Doctors cannot log in or appear to patients until you approve their application.</p>' +
          '<div class="appt-list">' + rows + '</div>';
      }

      function showDetails(userId) {
        var x = MC.Admin.applications().filter(function (a) { return a.user.id === userId; })[0]; if (!x) return;
        var u = x.user, d = x.doctor || {};
        function row(k, v) { return '<dt>' + k + '</dt><dd>' + (v ? esc(v) : '—') + '</dd>'; }
        App.modal({
          title: u.name,
          body: '<dl class="kv">' + row('Status', u.status) + row('Email', u.email) + row('Phone', u.phone) + row('Specialty', d.specialty) + row('License no.', u.license || d.license) + row('Experience', d.experience != null ? d.experience + ' years' : '') +
            row('Clinic', d.location) + row('Fee', d.fee != null ? d.fee + ' EGP' : '') + row('Bio', d.bio) + (u.status === 'rejected' ? row('Rejection reason', u.rejectionReason) : '') + '</dl>',
          actions: [{ label: 'Close', cls: 'btn-outline' }]
        });
      }

      function rejectModal(userId) {
        App.modal({
          title: 'Reject application',
          body: '<p class="muted">The applicant will not be able to log in. You can add a reason that they will see when they try.</p><div class="field"><label for="rejReason">Reason (optional)</label><textarea id="rejReason" maxlength="200"></textarea></div>',
          actions: [
            { label: 'Cancel', cls: 'btn-outline' },
            { label: 'Reject application', cls: 'btn-danger', onClick: function (close, box) {
              if (done(MC.Admin.rejectDoctor(userId, box.querySelector('#rejReason').value), 'Application rejected.')) { close(); renderAll(); }
            } }
          ]
        });
      }

      /* ---------- doctors ---------- */
      function doctorsPanel() {
        var rows = MC.Doctors.all().map(function (d) {
          var n = MC.Appts.forDoctor(d.id).length;
          var toggle = (d.status === 'active' || d.status === 'disabled')
            ? '<button class="btn btn-outline btn-sm" data-toggle="' + esc(d.id) + '" type="button">' + (d.status === 'disabled' ? 'Enable' : 'Disable') + '</button>' : '';
          return '<tr><td><strong>' + esc(d.name) + '</strong><div class="muted small">' + esc(d.location) + '</div></td><td>' + esc(d.specialty) + '</td><td>' + d.experience + ' yrs</td><td>' + d.fee + ' EGP</td><td>' + n + '</td><td>' + badge(d.status) + '</td>' +
            '<td class="actions"><button class="btn btn-outline btn-sm" data-edit="' + esc(d.id) + '" type="button">Edit</button>' + toggle +
            '<button class="btn btn-ghost-danger btn-sm" data-del="' + esc(d.id) + '" type="button">Delete</button></td></tr>';
        }).join('');
        return '<div class="card-head"><h2>Doctors</h2><button class="btn btn-primary btn-sm" id="addDoctor" type="button">＋ Add doctor</button></div>' +
          '<div class="table-wrap"><table class="table"><thead><tr><th>Doctor</th><th>Specialty</th><th>Experience</th><th>Fee</th><th>Bookings</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      }

      function doctorForm(d) {
        d = d || {};
        var isNew = !d.id;
        return '<form class="form" id="docForm" novalidate>' +
          '<div class="field"><label for="fName">Full name</label><input id="fName" value="' + esc(d.name || 'Dr. ') + '"><div class="error"></div></div>' +
          '<div class="form-row"><div class="field"><label for="fSpec">Specialty</label><input id="fSpec" value="' + esc(d.specialty || '') + '"><div class="error"></div></div>' +
          '<div class="field"><label for="fLoc">Location</label><input id="fLoc" value="' + esc(d.location || '') + '"><div class="error"></div></div></div>' +
          '<div class="form-row"><div class="field"><label for="fExp">Experience (years)</label><input id="fExp" type="number" min="0" max="60" value="' + (d.experience == null ? '' : d.experience) + '"><div class="error"></div></div>' +
          '<div class="field"><label for="fFee">Fee (EGP)</label><input id="fFee" type="number" min="0" step="10" value="' + (d.fee == null ? '' : d.fee) + '"><div class="error"></div></div></div>' +
          '<div class="field"><label for="fBio">Short bio</label><textarea id="fBio" maxlength="400">' + esc(d.bio || '') + '</textarea></div>' +
          (isNew ? '<div class="alert info small">Optional: create a login so this doctor can use the Doctor Dashboard (account is active immediately).</div>' +
            '<div class="form-row"><div class="field"><label for="fEmail">Login email</label><input id="fEmail" type="email"><div class="error"></div></div>' +
            '<div class="field"><label for="fPass">Password</label><input id="fPass" type="password" autocomplete="new-password"><div class="hint">8+ characters with a letter and a number.</div><div class="error"></div></div></div>' : '') +
          '</form>';
      }

      function openDoctorModal(d) {
        var isNew = !d;
        App.modal({
          title: isNew ? 'Add doctor' : 'Edit doctor', body: doctorForm(d),
          actions: [
            { label: 'Cancel', cls: 'btn-outline' },
            { label: 'Save', cls: 'btn-primary', onClick: function (close, box) {
              function v(id) { return box.querySelector('#' + id); }
              function err(el, m) { var f = el.closest('.field'); f.classList.toggle('invalid', !!m); f.querySelector('.error').textContent = m || ''; return !m; }
              var ok = err(v('fName'), v('fName').value.replace(/^dr\.?\s*/i, '').trim().length < 3 ? 'Enter the doctor\'s full name.' : '');
              ok = err(v('fSpec'), !v('fSpec').value.trim() ? 'Specialty is required.' : '') && ok;
              ok = err(v('fLoc'), !v('fLoc').value.trim() ? 'Location is required.' : '') && ok;
              ok = err(v('fExp'), v('fExp').value === '' || Number(v('fExp').value) < 0 ? 'Enter years of experience.' : '') && ok;
              ok = err(v('fFee'), v('fFee').value === '' || Number(v('fFee').value) < 0 ? 'Enter a valid fee.' : '') && ok;
              var email = isNew ? v('fEmail').value.trim() : '', pass = isNew ? v('fPass').value : '';
              if (isNew && (email || pass)) {
                ok = err(v('fEmail'), !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? 'Enter a valid email.' : (MC.Users.emailTaken(email) ? 'Email already in use.' : '')) && ok;
                ok = err(v('fPass'), MC.Auth.validatePassword(pass)) && ok;
              }
              if (!ok) return;
              var data = { name: v('fName').value, specialty: v('fSpec').value, location: v('fLoc').value, experience: Number(v('fExp').value), fee: Number(v('fFee').value), bio: v('fBio').value };
              var r = isNew ? MC.Admin.addDoctor(data, { email: email, password: pass }) : MC.Doctors.update(d.id, data);
              if (done(r, isNew ? 'Doctor added.' : 'Doctor updated.')) { close(); renderAll(); }
            } }
          ]
        });
      }

      /* ---------- appointments ---------- */
      function appointmentsPanel() {
        var list = MC.Appts.all().filter(function (a) { return apptFilter === 'all' || a.status === apptFilter; })
          .sort(function (a, b) { return (b.date + b.time).localeCompare(a.date + a.time); });
        var rows = list.map(function (a) {
          var p = MC.Users.byId(a.patientId) || { name: 'Deleted user' };
          var d = MC.Doctors.byId(a.doctorId) || { name: 'Deleted doctor' };
          return '<tr><td>' + esc(p.name) + '</td><td>' + esc(d.name) + '</td><td>' + U.fmtDate(a.date, { day: 'numeric', month: 'short', year: 'numeric' }) + '<div class="muted small">' + U.fmtTime(a.time) + '</div></td>' +
            '<td>' + App.statusBadge(a.status) + '</td>' +
            '<td class="actions"><select class="input" style="width:auto;padding:6px 8px;font-size:.82rem" data-status="' + esc(a.id) + '" aria-label="Change status">' +
            ['pending', 'confirmed', 'completed', 'cancelled'].map(function (s) { return '<option' + (s === a.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
            '</select><button class="btn btn-ghost-danger btn-sm" data-delappt="' + esc(a.id) + '" type="button">Delete</button></td></tr>';
        }).join('');
        return '<div class="card-head"><h2>All appointments</h2><div class="field" style="margin:0"><label class="sr-only" for="apptFilter">Status</label><select id="apptFilter">' +
          ['all', 'pending', 'confirmed', 'completed', 'cancelled'].map(function (s) { return '<option value="' + s + '"' + (s === apptFilter ? ' selected' : '') + '>' + (s === 'all' ? 'All statuses' : s[0].toUpperCase() + s.slice(1)) + '</option>'; }).join('') + '</select></div></div>' +
          (list.length ? '<div class="table-wrap"><table class="table"><thead><tr><th>Patient</th><th>Doctor</th><th>When</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="empty"><p>No appointments found.</p></div>');
      }

      /* ---------- users ---------- */
      function usersPanel() {
        var rows = MC.Users.all().map(function (u) {
          var self = u.id === me.id, s = u.status || 'active', acts;
          if (self) acts = '<span class="muted small">You</span>';
          else {
            acts = (s === 'active' || s === 'disabled') ? '<button class="btn btn-outline btn-sm" data-utoggle="' + esc(u.id) + '" type="button">' + (s === 'disabled' ? 'Enable' : 'Disable') + '</button>'
              : '<button class="btn btn-outline btn-sm" data-review="' + esc(u.id) + '" type="button">Review</button>';
            acts += '<button class="btn btn-ghost-danger btn-sm" data-udel="' + esc(u.id) + '" type="button">Delete</button>';
          }
          return '<tr><td><strong>' + esc(u.name) + '</strong></td><td>' + esc(u.email) + '</td><td><span class="badge role">' + esc(u.role) + '</span></td><td>' + badge(s) + '</td><td class="actions">' + acts + '</td></tr>';
        }).join('');
        return '<div class="card-head"><h2>Users</h2><button class="btn btn-primary btn-sm" id="addAdmin" type="button">＋ Add administrator</button></div>' +
          '<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      }

      function openAdminModal() {
        App.modal({
          title: 'Add administrator',
          body: '<div class="alert info small">Administrator accounts can only be created here, by a signed-in administrator.</div><form class="form" novalidate>' +
            '<div class="field"><label for="aName">Full name</label><input id="aName"><div class="error"></div></div>' +
            '<div class="field"><label for="aEmail">Email</label><input id="aEmail" type="email"><div class="error"></div></div>' +
            '<div class="field"><label for="aPass">Password</label><input id="aPass" type="password" autocomplete="new-password"><div class="hint">8+ characters with a letter and a number.</div><div class="error"></div></div></form>',
          actions: [
            { label: 'Cancel', cls: 'btn-outline' },
            { label: 'Create administrator', cls: 'btn-primary', onClick: function (close, box) {
              function v(id) { return box.querySelector('#' + id); }
              function err(el, m) { var f = el.closest('.field'); f.classList.toggle('invalid', !!m); f.querySelector('.error').textContent = m || ''; return !m; }
              var ok = err(v('aName'), v('aName').value.trim().length < 3 ? 'Enter the full name.' : '');
              ok = err(v('aEmail'), !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('aEmail').value.trim()) ? 'Enter a valid email.' : (MC.Users.emailTaken(v('aEmail').value) ? 'Email already in use.' : '')) && ok;
              ok = err(v('aPass'), MC.Auth.validatePassword(v('aPass').value)) && ok;
              if (!ok) return;
              if (done(MC.Users.createAdmin({ name: v('aName').value, email: v('aEmail').value, password: v('aPass').value }), 'Administrator created.')) { close(); renderAll(); }
            } }
          ]
        });
      }

      /* ---------- render / events ---------- */
      function renderPanel() {
        $('panel').innerHTML = tab === 'applications' ? applicationsPanel() : tab === 'doctors' ? doctorsPanel() : tab === 'appointments' ? appointmentsPanel() : usersPanel();
        document.querySelectorAll('.tab').forEach(function (x) { var on = x.dataset.t === tab; x.classList.toggle('active', on); x.setAttribute('aria-selected', String(on)); });
      }
      function renderAll() { renderStats(); renderPanel(); }
      function goTab(t) { tab = t; renderAll(); }

      $('tabs').addEventListener('click', function (e) { var t = e.target.closest('.tab'); if (t) goTab(t.dataset.t); });
      $('banner').addEventListener('click', function (e) { if (e.target.id === 'openApps') goTab('applications'); });

      $('panel').addEventListener('click', function (e) {
        var t = e.target.closest('button'); if (!t) return;
        var ds = t.dataset;
        if (t.id === 'addDoctor') return openDoctorModal(null);
        if (t.id === 'addAdmin') return openAdminModal();
        if (ds.details) return showDetails(ds.details);
        if (ds.review) return goTab('applications');
        if (ds.approve) return App.confirmBox('Approve this doctor?', 'The doctor will be able to log in and will appear in the doctors list for patients.', 'Approve', function () { if (done(MC.Admin.approveDoctor(ds.approve), 'Doctor approved.')) renderAll(); }, false);
        if (ds.reject) return rejectModal(ds.reject);
        if (ds.edit) return openDoctorModal(MC.Doctors.byId(ds.edit));
        if (ds.toggle) { var d = MC.Doctors.byId(ds.toggle); if (done(MC.Doctors.setStatus(d.id, d.status === 'disabled' ? 'active' : 'disabled'), 'Doctor ' + (d.status === 'disabled' ? 'enabled' : 'disabled') + '.')) renderAll(); return; }
        if (ds.del) return App.confirmBox('Delete doctor?', 'The doctor, their login and all of their appointments will be removed. This cannot be undone.', 'Delete', function () { if (done(MC.Doctors.removeCascade(ds.del), 'Doctor deleted.')) renderAll(); });
        if (ds.delappt) return App.confirmBox('Delete appointment?', 'This permanently removes the appointment.', 'Delete', function () { if (done(MC.Appts.remove(ds.delappt), 'Appointment deleted.')) renderAll(); });
        if (ds.utoggle) { var u = MC.Users.byId(ds.utoggle); if (done(MC.Users.setStatus(u.id, u.status === 'disabled' ? 'active' : 'disabled'), 'User ' + (u.status === 'disabled' ? 'enabled' : 'disabled') + '.')) renderAll(); return; }
        if (ds.udel) return App.confirmBox('Delete user?', 'The account and its appointments will be removed.', 'Delete', function () { if (done(MC.Users.removeCascade(ds.udel), 'User deleted.')) renderAll(); });
      });

      $('panel').addEventListener('change', function (e) {
        if (e.target.id === 'apptFilter') { apptFilter = e.target.value; return renderPanel(); }
        if (e.target.dataset.status) { if (done(MC.Appts.setStatus(e.target.dataset.status, e.target.value), 'Status updated.')) renderAll(); }
      });

      $('resetBtn').addEventListener('click', function () {
        App.confirmBox('Reset demo data?', 'All doctors, users and appointments return to the original defaults and you will be logged out.', 'Reset', function () {
          if (MC.resetAll().ok) location.href = 'admin-login.html';
        });
      });

      renderAll();
    })();
  </script>
</body>
</html>
