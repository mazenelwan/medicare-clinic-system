<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Appointments – MediCare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230f766e%27/%3E%3Cpath d=%27M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z%27 fill=%27white%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1>My appointments</h1>
          <p>View, reschedule or cancel your bookings.</p>
        </div>
        <a class="btn btn-primary" href="doctors.html">＋ New appointment</a>
      </div>

      <div class="tabs" id="tabs" role="tablist" aria-label="Filter appointments">
        <button class="tab active" role="tab" aria-selected="true" data-f="upcoming" type="button">Upcoming</button>
        <button class="tab" role="tab" aria-selected="false" data-f="completed" type="button">Completed</button>
        <button class="tab" role="tab" aria-selected="false" data-f="cancelled" type="button">Cancelled</button>
        <button class="tab" role="tab" aria-selected="false" data-f="all" type="button">All</button>
      </div>

      <div class="appt-list" id="list" aria-live="polite"></div>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var user = App.init({ roles: ['patient'], active: 'my-appointments.html' });
      if (!user) return;
      var U = MC.util, esc = App.esc;
      var filter = 'upcoming';

      function matches(a) {
        if (filter === 'all') return true;
        if (filter === 'upcoming') return MC.Appts.isUpcoming(a);
        if (filter === 'completed') return a.status === 'completed' || ((a.status === 'confirmed' || a.status === 'pending') && !MC.Appts.isUpcoming(a));
        return a.status === 'cancelled';
      }

      function render() {
        var list = MC.Appts.forPatient(user.id).filter(matches).sort(function (a, b) {
          var c = (a.date + a.time).localeCompare(b.date + b.time);
          return filter === 'upcoming' ? c : -c;
        });
        var box = document.getElementById('list');
        if (!list.length) {
          box.innerHTML = '<div class="card empty"><div class="big" aria-hidden="true">📭</div><h3>No ' + (filter === 'all' ? '' : filter + ' ') + 'appointments</h3><p>When you book a visit it will show up here.</p><a class="btn btn-primary" href="doctors.html">Find a doctor</a></div>';
          return;
        }
        box.innerHTML = list.map(function (a) {
          var d = MC.Doctors.byId(a.doctorId) || { name: 'Unknown doctor', specialty: '', id: '' };
          var dt = U.parseISO(a.date);
          var active = MC.Appts.isUpcoming(a);
          return '<article class="appt" data-id="' + esc(a.id) + '"><div class="appt-main"><div class="appt-date"><strong>' + dt.getDate() + '</strong><span>' + dt.toLocaleDateString('en-GB', { month: 'short' }) + '</span></div>' +
            '<div style="min-width:0"><h3>' + esc(d.name) + '</h3><p>' + esc(d.specialty) + ' · ' + U.fmtDate(a.date, { weekday: 'long' }) + ' · ' + U.fmtTime(a.time) + '</p><p>' + esc(a.reason || '') + '</p></div></div>' +
            '<div class="appt-actions">' + App.statusBadge(a.status) +
            (d.id ? '<a class="btn btn-outline btn-sm" href="doctor-profile.html?id=' + encodeURIComponent(d.id) + '">Doctor</a>' : '') +
            (active ? '<a class="btn btn-outline btn-sm" href="booking.html?reschedule=' + encodeURIComponent(a.id) + '">Reschedule</a><button class="btn btn-ghost-danger btn-sm" data-cancel="' + esc(a.id) + '" type="button">Cancel</button>' : '') +
            (a.status === 'cancelled' && d.id ? '<a class="btn btn-primary btn-sm" href="booking.html?doctor=' + encodeURIComponent(d.id) + '">Book again</a>' : '') +
            '</div></article>';
        }).join('');
      }

      document.getElementById('tabs').addEventListener('click', function (e) {
        var t = e.target.closest('.tab'); if (!t) return;
        filter = t.dataset.f;
        document.querySelectorAll('.tab').forEach(function (x) { var on = x === t; x.classList.toggle('active', on); x.setAttribute('aria-selected', String(on)); });
        render();
      });

      document.getElementById('list').addEventListener('click', function (e) {
        var b = e.target.closest('[data-cancel]'); if (!b) return;
        var id = b.dataset.cancel;
        App.confirmBox('Cancel appointment?', 'This will free the time slot. You can book again at any time.', 'Yes, cancel it', function () {
          MC.Appts.setStatus(id, 'cancelled');
          App.toast('Appointment cancelled.', 'ok');
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
